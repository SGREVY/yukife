<style>
 /* LISTA */
#lista {
  list-style: none;
  padding: 0;
  max-width: 700px;
  margin: 30px auto;
}

/* ITEMS */
#lista li {
  background: #1a1a1a;
  color: white;
  margin-bottom: 15px;
  padding: 15px 20px;
  border-radius: 12px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  transition: all 0.2s ease;

  /* 👇 mejora visual */
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

#lista li:hover {
  transform: scale(1.02);
  box-shadow: 0 10px 25px rgba(255, 77, 109, 0.3);
}

/* TITULO PRINCIPAL */
h1 {
  text-align: center;
  color: white;
  margin-top: 20px;
  font-family: 'Poppins', sans-serif;
}

/* INFO PRODUCTO */
.producto-info {
  display: flex;
  flex-direction: column;
}

.producto-info h3 {
  margin: 0;
  font-size: 18px;
  font-family: 'Poppins', sans-serif;
}

.producto-info p {
  margin: 5px 0 0;
  color: #ff4d6d; 
  font-weight: bold;
}

/* BOTÓN ELIMINAR */
#lista button {
  background: transparent;
  border: none;
  color: #ff4d6d;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s ease;
}

#lista button:hover {
  transform: scale(1.2);
  color: #ff8fab;
}

/* TOTAL */
h2 {
  text-align: center;
  margin-top: 20px;
  color: #e0e0e0;
  font-family: 'Poppins', sans-serif;
}

/* BOTÓN PAGAR */
#pagar {
  display: block;
  margin: 20px auto;
  padding: 12px 25px;
  background: #ff4d6d;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.3s ease;
}

#pagar:hover {
  background: #ff8fab;
  transform: scale(1.05);
  box-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
}
